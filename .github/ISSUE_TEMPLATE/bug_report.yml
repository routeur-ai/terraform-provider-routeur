name: Bug report
description: Something in the provider does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security issues: please do not open an issue; see SECURITY.md.
        Remove tokens, provider API keys and other secrets from everything you paste.
  - type: input
    id: provider-version
    attributes:
      label: Provider version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: terraform-version
    attributes:
      label: Terraform version
      description: Output of `terraform version`.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The smallest configuration that shows the problem.
      render: terraform
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the full error. API errors end with "routeur.ai API: HTTP …, request id …"; the request id helps us find the call.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. terraform apply
        2. ...
